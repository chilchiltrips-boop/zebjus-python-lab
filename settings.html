<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>ZEBJUS Python Lab Settings</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="settings-page">
  <header class="topbar">
    <div>
      <h1>Python Lab Settings</h1>
      <p>Camera, kit and editor preferences</p>
    </div>
    <a class="btn primary" href="./index.html">← Back to Lab</a>
  </header>

  <main class="settings-layout">
    <section class="panel settings-card">
      <div class="panel-title"><strong>Camera</strong></div>
      <div class="settings-body">
        <label>
          <span>Camera index / device</span>
          <select id="cameraSelect">
            <option value="">Camera 0 (default)</option>
          </select>
        </label>

        <label class="switch-row">
          <div>
            <strong>Auto-start camera on Run</strong>
            <span>Useful for MediaPipe and OpenCV camera projects.</span>
          </div>
          <input id="autoCamera" type="checkbox">
        </label>

        <button id="refreshCameraBtn" class="btn">Refresh Camera List</button>
        <p class="muted settings-note">Student code can also use <code>Camera(0)</code>, <code>Camera(1)</code>, etc.</p>
      </div>
    </section>

    <section class="panel settings-card">
      <div class="panel-title"><strong>Kit Connection</strong></div>
      <div class="settings-body">
        <label class="switch-row">
          <div>
            <strong>Demo mode</strong>
            <span>Use the on-screen LED, motor and servo graphics.</span>
          </div>
          <input id="demoMode" type="checkbox">
        </label>

        <label>
          <span>Kit ID</span>
          <input id="kitId" value="ZB-000123">
        </label>

        <label>
          <span>Secure WebSocket URL</span>
          <input id="wsUrl" placeholder="wss://lab-api.zebjus.com/ws">
        </label>
      </div>
    </section>

    <section class="panel settings-card">
      <div class="panel-title"><strong>Editor</strong></div>
      <div class="settings-body">
        <label>
          <span>Font size</span>
          <select id="fontSize">
            <option value="13">13 px</option>
            <option value="14">14 px</option>
            <option value="15">15 px</option>
            <option value="16">16 px</option>
            <option value="17">17 px</option>
          </select>
        </label>

        <label class="switch-row">
          <div>
            <strong>Auto-save student code</strong>
            <span>Keep code in this browser after refresh.</span>
          </div>
          <input id="autoSave" type="checkbox">
        </label>
      </div>
    </section>

    <section class="panel settings-card">
      <div class="panel-title"><strong>Program Input</strong></div>
      <div class="settings-body">
        <label>
          <span>Values for Python input()</span>
          <textarea id="stdinBox" rows="6" placeholder="One value per line"></textarea>
        </label>
        <p class="muted settings-note">Example: first line is used by the first <code>input()</code>, second line by the next.</p>
      </div>
    </section>

    <div class="settings-actions">
      <button id="saveSettingsBtn" class="btn success">Save Settings</button>
      <button id="resetSettingsBtn" class="btn">Reset Defaults</button>
      <span id="settingsSaved" class="muted"></span>
    </div>
  </main>

  <script type="module" src="./settings.js"></script>
</body>
</html>
