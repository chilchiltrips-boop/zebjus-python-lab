<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>ZEBJUS Camera Bridge</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body{min-height:100dvh;display:grid;place-items:center;padding:10px}
    .bridge{width:min(520px,100%);background:#121a2d;border:1px solid #24314f;border-radius:12px;overflow:hidden}
    .bridge-head{padding:12px;border-bottom:1px solid #24314f}
    .bridge-head h1{font-size:16px;margin:0 0 4px}.bridge-head p{font-size:10px;color:#9aa8c4;margin:0}
    .bridge-video{position:relative;aspect-ratio:4/3;background:#070b14}
    #bridgeVideo,#bridgeOverlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #bridgeOverlay{pointer-events:none}
    .bridge-state{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
    .bridge-state div{background:#0a1120;border:1px solid #24314f;border-radius:7px;padding:7px;text-align:center}
    .bridge-state span{display:block;font-size:8px;color:#9aa8c4}.bridge-state strong{font-size:13px}
    .bridge-actions{display:flex;gap:6px;padding:8px}.bridge-actions button{flex:1}
    #bridgeMessage{padding:0 9px 10px;color:#9aa8c4;font-size:10px;line-height:1.4}
  </style>
</head>
<body>
  <section class="bridge">
    <div class="bridge-head">
      <h1>ZEBJUS Camera Bridge</h1>
      <p>Camera permission is requested here because the Wix Online Programs iframe blocks camera access.</p>
    </div>

    <div class="bridge-video">
      <video id="bridgeVideo" playsinline muted></video>
      <canvas id="bridgeOverlay"></canvas>
    </div>

    <div class="bridge-state">
      <div><span>Hand</span><strong id="bHand">—</strong></div>
      <div><span>Fingers</span><strong id="bFingers">0</strong></div>
      <div><span>Side</span><strong id="bSide">—</strong></div><div><span>Faces</span><strong id="bFaces">0</strong></div>
    </div>

    <div class="bridge-actions">
      <button id="startBridgeBtn" class="btn primary">Start Camera</button>
      <button id="sendSnapshotBtn" class="btn success">Send Snapshot</button>
      <button id="closeBridgeBtn" class="btn">Close</button>
    </div>
    <div id="bridgeMessage">Starting camera… Allow camera permission when your browser asks.</div>
  </section>

  <script src="./config.js"></script>
  <script src="./ai.js"></script>
  <script src="./camera-bridge.js"></script>
</body>
</html>
