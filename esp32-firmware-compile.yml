name: ESP32 Firmware Compile
on:
  push:
    paths:
      - 'esp32_firmware/**'
      - '.github/workflows/esp32-firmware-compile.yml'
  pull_request:
    paths:
      - 'esp32_firmware/**'
      - '.github/workflows/esp32-firmware-compile.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install libraries
        run: arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO"
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 esp32_firmware/ZEBJUS_Kit_Universal_Hardware_Bridge_WiFi_v2_3_1
